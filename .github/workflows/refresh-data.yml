name: Refresh data snapshots

on:
  workflow_dispatch: {}
  schedule:
    # 16:30 Asia/Shanghai, every day. GitHub cron uses UTC.
    - cron: "30 8 * * *"

permissions:
  contents: write

concurrency:
  group: refresh-data-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout website
        uses: actions/checkout@v6
        with:
          path: website

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            sleep $((attempt * 15))
          done

      - name: Refresh quotes
        working-directory: website
        run: python -m scripts.refresh_quotes --sleep-seconds 0.05

      - name: Refresh candidates
        working-directory: website
        env:
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS || secrets.ANSPIRE_API_KEY }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS || secrets.BOCHA_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS || secrets.TAVILY_API_KEY }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS || secrets.BRAVE_API_KEY }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS || secrets.SERPAPI_API_KEY }}
          MINIMAX_API_KEYS: ${{ secrets.MINIMAX_API_KEYS || secrets.MINIMAX_API_KEY }}
        run: python -m scripts.refresh_candidates --max-candidates 300 --max-promoted-per-sector 30 --max-queries-per-sector 4

      - name: Refresh evidence
        working-directory: website
        env:
          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS || secrets.ANSPIRE_API_KEY }}
          BOCHA_API_KEYS: ${{ secrets.BOCHA_API_KEYS || secrets.BOCHA_API_KEY }}
          TAVILY_API_KEYS: ${{ secrets.TAVILY_API_KEYS || secrets.TAVILY_API_KEY }}
          BRAVE_API_KEYS: ${{ secrets.BRAVE_API_KEYS || secrets.BRAVE_API_KEY }}
          SERPAPI_API_KEYS: ${{ secrets.SERPAPI_API_KEYS || secrets.SERPAPI_API_KEY }}
          MINIMAX_API_KEYS: ${{ secrets.MINIMAX_API_KEYS || secrets.MINIMAX_API_KEY }}
        run: python -m scripts.refresh_evidence --max-searches 4 --results-per-dimension 2 --sleep-seconds 0.1

      - name: Refresh ranking
        working-directory: website
        run: python -m scripts.refresh_ranking

      - name: Validate data and build
        working-directory: website
        run: |
          node scripts/validate-data.mjs
          npm run build

      - name: Commit refreshed snapshots
        working-directory: website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data package-lock.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh data snapshots"
            git push
          fi
